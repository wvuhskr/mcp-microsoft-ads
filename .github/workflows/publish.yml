name: publish

# Publishes to PyPI on a version tag push (e.g. v1.0.2), using PyPI Trusted
# Publishing (OIDC) — no API token stored anywhere. Configure the trusted
# publisher on PyPI first: project mcp-microsoft-ads, owner wvuhskr, repo
# mcp-microsoft-ads, workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
