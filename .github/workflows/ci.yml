name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]  # floor + the version daily dev actually runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans full history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" ruff bandit
      - run: ruff check .
      - run: bandit -r mcp_microsoft_ads -q
      - run: python -m pytest -q --cov=mcp_microsoft_ads --cov-fail-under=85
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments disabled: our token is contents-read-only (no pull-requests
          # perm), so gitleaks' PR-comment API call would 403. Leak findings still
          # fail the job with details in the log.
          GITLEAKS_ENABLE_COMMENTS: "false"
