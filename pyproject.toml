[project]
name = "mcp-microsoft-ads"
version = "1.0.1"
requires-python = ">=3.12"
dependencies = ["bingads==13.0.29", "mcp>=1.0,<3", "pyyaml>=6.0.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.9.4"]

[project.scripts]
mcp-microsoft-ads = "mcp_microsoft_ads.server:main"

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # FastMCP's own settings model (not our code) trips this on pydantic-settings
    # >=2.15 at FastMCP(...) construction time (mcp_microsoft_ads/app.py). Message-only
    # (no category/module) on purpose: a `category:module` filter is imported by pytest
    # at config-load time, which crashes outright on pydantic-settings <2.15 -- that
    # version doesn't define IncompleteFieldDefinitionWarning at all.
    "ignore:Field 'lifespan' has an incomplete definition",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Correctness + import hygiene only. No formatter, no style-opinion rules:
# blind excepts are deliberate (audit hardening must never mask a landed write).
select = ["E4", "E7", "E9", "F", "I"]
